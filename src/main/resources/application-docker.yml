spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:dts_practice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

logging:
  level:
    root: INFO
    com.dts.practice: INFO
