spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:dts_practice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:K59Ptl*100504}
  jpa:
    hibernate:
      ddl-auto: none  # Flyway manages schema; skip Hibernate validation to avoid array-type mismatch (_int4 vs INTEGER[])
  cache:
    type: caffeine
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
    consumer:
      group-id: practice-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dts.identity.*,com.dts.practice.dto.event,java.util,java.lang"

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.dts.practice: INFO