services:
  practice-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-phamthanhlong100504-xpnd}/practice-service:latest
    container_name: dts-practice-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "${SERVER_PORT:-8087}:8087"
    mem_limit: 350m
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8087
      - DB_HOST=103.20.96.85
      - DB_PORT=5434
      - DB_NAME=${DB_NAME:-dts_practice}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=K59Ptl*100504
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-uPq3xK8mR5vY2wZ9aB4cD7eF1gH3iJ6kL0nO5pQ8rS2tU4vW6xY9zA1bC3dE7fG9}
      - JWT_ISSUER=${JWT_ISSUER:-dts-identity-service}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://dts-identity-service:8081}
      - SPRING_DATA_REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-103.20.96.85:9092}
      - SPRING_KAFKA_LISTENER_AUTO_STARTUP=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:-true}
      - EUREKA_URI=${EUREKA_URI:-http://eureka-server:8761/eureka/}
      - EUREKA_ENABLED=${EUREKA_ENABLED:-true}
      - SIMULATION_CONTENT_ORIGIN=${SIMULATION_CONTENT_ORIGIN:-http://content-builder:8082}
      - SIMULATION_MEDIA_ORIGIN=${SIMULATION_MEDIA_ORIGIN:-http://103.20.96.85:8080}
      - EXAM_PROGRESS_OUTBOX_ENABLED=${EXAM_PROGRESS_OUTBOX_ENABLED:-true}
      - PROGRESS_SERVICE_URL=${PROGRESS_SERVICE_URL:-http://dts-progress:8083}
      - EXAM_PROGRESS_INTERNAL_KEY=${EXAM_PROGRESS_INTERNAL_KEY:-dts-internal-secret-progress-2024}
    extra_hosts:
      - "kafka:103.20.96.85"
    networks:
      - dts-network

networks:
  dts-network:
    external: true