services:
  practice-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-phamthanhlong100504-xpnd}/practice-service:latest
    container_name: dts-practice-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8087}:8087"
    mem_limit: 180m
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m -Xquickstart
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-dts_practice}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-dts-identity-service}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://dts-identity-service:8081}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-media-kafka:9092}
      - EUREKA_URI=${EUREKA_URI:-http://eureka-server:8761/eureka}
      - EUREKA_ENABLED=${EUREKA_ENABLED:-false}
    networks:
      - dts-network

networks:
  dts-network:
    external: true
