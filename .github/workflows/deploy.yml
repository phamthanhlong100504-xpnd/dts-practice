name: Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/practice-service
  DEPLOY_DIR: /dts/practice-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Unit Tests
        run: mvn test -B || true

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml

      - name: Build Jar
        run: mvn clean package -B -DskipTests

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Prepare docker-compose payload
        id: compose
        run: |
          echo "B64=$(base64 -w 0 docker-compose.prod.yml)" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.B64 }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          EXAM_PROGRESS_INTERNAL_KEY: ${{ secrets.EXAM_PROGRESS_INTERNAL_KEY || 'dts-internal-secret-progress-2024' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: COMPOSE_B64,DB_PASSWORD,JWT_ACCESS_SECRET,REDIS_PASSWORD,GITHUB_TOKEN,EXAM_PROGRESS_INTERNAL_KEY
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}
            docker network create dts-network || true
            cd ${{ env.DEPLOY_DIR }}
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
            export GITHUB_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            sed -i "s/${GITHUB_OWNER}/$GITHUB_OWNER/g" docker-compose.yml
            echo "GITHUB_REPOSITORY_OWNER=$GITHUB_OWNER" > .env
            echo "SERVER_PORT=8087" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" >> .env
            echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> .env
            echo "EXAM_PROGRESS_INTERNAL_KEY=$EXAM_PROGRESS_INTERNAL_KEY" >> .env
            echo "EXAM_PROGRESS_OUTBOX_ENABLED=false" >> .env
            echo "PROGRESS_SERVICE_URL=http://dts-progress:8083" >> .env
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_OWNER --password-stdin
            docker compose pull
            docker compose up -d
            docker compose ps -a
            docker logs dts-practice-service --tail 50 || true
            docker image prune -a -f
